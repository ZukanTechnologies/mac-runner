name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all shell scripts
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(**/*.sh)
          echo "checking: ${files[*]}"
          shellcheck "${files[@]}"

  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats-core
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: run test suite
        run: bats tests/
