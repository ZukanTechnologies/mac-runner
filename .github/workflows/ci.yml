name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all shell scripts
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(**/*.sh)
          echo "checking: ${files[*]}"
          shellcheck "${files[@]}"

  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install bats-core
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: run test suite
        run: bats tests/

  packer:
    # This repo owns the image template, so a syntax/reference error here is a
    # broken fleet image — and it would otherwise only surface an hour into a
    # build on a Mac, since Packer parses the template at build time.
    #
    # Runs on macOS, not Linux: packer-plugin-tart ships darwin/arm64 ONLY
    # (Tart is Apple-Silicon-exclusive), so `packer init` on ubuntu fails with
    # "could not find a local nor a remote checksum for plugin". This repo is
    # public, so GitHub-hosted macOS minutes are free.
    #
    # This VALIDATES, it does not build: no VM boots, no Apple credentials, no
    # .xip. (`-syntax-only` would run on Linux without the plugin, but it skips
    # provisioner and variable checking — the weaker check isn't worth the
    # weaker guarantee when the stronger one is free.)
    name: packer validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3
        with:
          version: latest
      - name: packer init + fmt + validate
        working-directory: packer
        run: |
          packer init .
          packer fmt -check -diff .
          # Two vars must be supplied for validation to resolve:
          #   image_version — required, no default (build.sh passes it).
          #   xcode_xip     — defaults to ~/XcodesCache/Xcode_26.6.xip, and
          #                   `validate` PREPARES the `file` provisioner, which
          #                   stat()s the source. That .xip is a manual,
          #                   Apple-account-gated download that will never exist
          #                   on a CI runner, so point it at a stub file.
          #                   (Without this the job fails 100% of the time with
          #                   "Bad source ...: no such file or directory".)
          touch "$RUNNER_TEMP/stub.xip"
          packer validate \
            -var 'image_version=ci-validate' \
            -var "xcode_xip=$RUNNER_TEMP/stub.xip" \
            zukan-mobile-runner.pkr.hcl
